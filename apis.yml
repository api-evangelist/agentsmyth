aid: agentsmyth
name: AgentSmyth
description: >-
  AgentSmyth is a New York based financial-technology company building autonomous AI agents for
  institutional trading and investment research. The platform orchestrates a set of specialized
  agents - Macro, Sentiment, Quant, Options and Earnings, plus an Agent Wealth beta - that compress
  the research-to-trade workflow from hours to seconds and return cited, auditable market
  intelligence to traders, hedge funds, banks and asset managers. Delivery is an enterprise SaaS
  desk with per-tenant isolation, SSO/SAML with SCIM, model allow/deny governance and optional
  VPC/on-prem inference. The company runs a Kong Enterprise API gateway at api.agentsmyth.com, a
  private Kong Konnect developer portal, and an OAuth-protected remote MCP server that exposes the
  agent desk to MCP clients. Founded in 2024 by Pulkit Jaiswal, Daniel McCooey and Robert DiFazio,
  it has raised 11.2M dollars including an 8.7M dollar seed co-led by FinTech Collective and
  Thomson Reuters, with BNY participating through its Ascent program.
